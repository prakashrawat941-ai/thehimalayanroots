name: Deploy Himalayan Roots homepage to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "public/images/himalaya/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare static homepage
        run: |
          mkdir -p site/images/himalaya
          cp public/images/himalaya/hero.jpg site/images/himalaya/hero.jpg
          cp public/images/himalaya/kumaon.jpg site/images/himalaya/kumaon.jpg
          cp public/images/himalaya/munsiyari.jpg site/images/himalaya/munsiyari.jpg
          cp public/images/himalaya/jageshwar.jpg site/images/himalaya/jageshwar.jpg
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

