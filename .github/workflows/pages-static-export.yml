name: GitHub Pages static export verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-static-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-export:
    name: Static export and artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://kjuboknsxlsotzoibdnv.supabase.co
      NEXT_PUBLIC_SITE_URL: https://prakashrawat941-ai.github.io/thehimalayanroots
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build static export
        run: npm run build
      - name: Validate Pages output
        run: |
          test -f out/index.html
          test -d out/_next
          touch out/.nojekyll
          echo "Static export contains index.html and Next.js assets."
